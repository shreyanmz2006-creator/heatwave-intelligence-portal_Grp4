<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspot Map</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .map-frame {
            width: 50%;
            margin: 20px auto;
            border: 4px solid #d84315;
            border-radius: 8px;
            padding: 6px;
            overflow: hidden;
            text-align: center;
        }
        .map-frame img {
            width: 100%;
            height: auto;
            transition: transform 0.4s ease;
            display: block;
        }
        .map-frame img:hover {
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <h1 style="text-align:center;">Regional Heatwave Map</h1>

    <div class="map-frame">
        <img src="map.jpg"
            usemap="#region"
            width="100%">
    </div>

    <map name="region">
        <area shape="rect"
            coords="0,0,1000,500"
            href="https://en.wikipedia.org/wiki/North_India">
        <area shape="rect"
            coords="0,500,1000,1000"
            href="https://en.wikipedia.org/wiki/South_India">
    </map>

    <footer>&copy; 2026 Heatwave Intelligence System</footer>

</body>
</html>
